<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetHub OMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { font-family: 'DM Sans', sans-serif; }
  code, .mono { font-family: 'DM Mono', monospace; }
  [x-cloak] { display: none !important; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

  .sidebar-link { @apply w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150; }
  .badge { @apply text-[10px] font-bold px-2 py-0.5 rounded-lg; }

  /* Toast */
  .toast-enter { animation: toastIn 0.3s ease forwards; }
  .toast-leave { animation: toastOut 0.3s ease forwards; }
  @keyframes toastIn { from { opacity:0; transform: translateY(16px) scale(0.96); } to { opacity:1; transform: translateY(0) scale(1); } }
  @keyframes toastOut { from { opacity:1; transform: translateY(0) scale(1); } to { opacity:0; transform: translateY(8px) scale(0.96); } }

  /* Card hover */
  .order-card { transition: box-shadow 0.15s ease, transform 0.15s ease; }
  .order-card:hover { box-shadow: 0 8px 24px -4px rgba(0,0,0,0.08); transform: translateY(-1px); }

  /* Checklist item */
  .check-item input[type=checkbox]:checked + span { text-decoration: line-through; color: #9ca3af; }

  /* Mobile nav bottom */
  @media (max-width: 767px) {
    .mobile-safe { padding-bottom: 72px; }
  }

  /* Pulse dot */
  .pulse-dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  /* Km field */
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .copy-msg-box { background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 14px; padding: 14px 16px; font-size: 12px; line-height: 1.7; white-space: pre-wrap; color: #166534; font-family: 'DM Mono', monospace; }

  .stage-pill { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; }
</style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased" x-data="oms()" x-init="init()" x-cloak>

<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none" style="min-width:280px">
  <template x-for="toast in toasts" :key="toast.id">
    <div class="toast-enter pointer-events-auto bg-gray-900 text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 max-w-xs">
      <span x-text="toast.icon"></span>
      <span x-text="toast.msg"></span>
    </div>
  </template>
</div>

<div x-show="msgModal.open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end md:items-center justify-center p-4">
  <div @click.stop class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-sm font-bold text-gray-900" x-text="msgModal.title"></div>
        <div class="text-[11px] text-gray-400 mt-0.5">Will open direct WhatsApp API string</div>
      </div>
      <span class="text-xl">💬</span>
    </div>
    <div class="copy-msg-box" x-text="msgModal.text"></div>
    <div class="flex gap-2">
      <button @click="openWhatsAppAndProceed()" class="flex-1 bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2">
        <span>🚀</span> <span>Open WhatsApp</span>
      </button>
      <button @click="msgModal.open = false; if(msgModal.onSkip) msgModal.onSkip();" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-semibold py-3 px-4 rounded-xl transition-all">Skip Link</button>
    </div>
  </div>
</div>

<div x-show="settlementModal.open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end md:items-center justify-center p-4">
  <div @click.stop class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4">
    <div>
      <div class="text-sm font-bold text-gray-900">Mark as Delivered</div>
      <div class="text-[11px] text-gray-400 mt-0.5" x-text="settlementModal.order ? settlementModal.order.id + ' · ' + settlementModal.order.parentName : ''"></div>
    </div>
    <div class="bg-gray-50 rounded-xl p-4 flex justify-between items-center">
      <span class="text-xs text-gray-500 font-medium">Order Total</span>
      <span class="text-2xl font-black text-gray-900" x-text="'₹' + (settlementModal.order ? settlementModal.order.total : 0)"></span>
    </div>
    <div class="space-y-2">
      <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Payment Received Via</div>
      <div class="grid grid-cols-3 gap-2">
        <template x-for="mode in ['UPI','Cash','Pending']">
          <button @click="settlementModal.paymentMode = mode"
            :class="settlementModal.paymentMode === mode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
            class="py-2.5 text-xs font-bold rounded-xl transition-all" x-text="mode"></button>
        </template>
      </div>
    </div>
    <div class="flex gap-2">
      <button @click="confirmDelivered()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3 rounded-xl transition-all">✓ Confirm Delivered</button>
      <button @click="settlementModal.open = false" class="bg-gray-100 text-gray-600 text-xs font-semibold py-3 px-4 rounded-xl">Cancel</button>
    </div>
  </div>
</div>

<div class="min-h-screen flex flex-col md:flex-row">

  <aside class="hidden md:flex w-56 bg-white border-r border-gray-100 flex-col justify-between shrink-0 fixed top-0 left-0 h-full z-30">
    <div>
      <div class="px-5 py-5 border-b border-gray-50">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center text-white text-lg shadow-sm">🐾</div>
          <div>
            <div class="text-sm font-black text-gray-900 tracking-tight">PetHub</div>
            <div class="text-[9px] font-bold text-gray-400 tracking-widest uppercase">Operations</div>
          </div>
        </div>
      </div>

      <nav class="p-3 space-y-0.5 mt-1">
        <button @click="currentView='dashboard'"
          :class="currentView==='dashboard' ? 'bg-gray-900 text-white' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'"
          class="sidebar-link">
          <span class="flex items-center gap-2.5"><span>🏠</span><span>Dashboard</span></span>
        </button>

        <div class="pt-3 pb-1 px-3 text-[9px] font-bold text-gray-300 tracking-widest uppercase">Order Pipeline</div>

        <button @click="currentView='unconfirmed'"
          :class="currentView==='unconfirmed' ? 'bg-amber-50 text-amber-800' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'"
          class="sidebar-link">
          <span class="flex items-center gap-2.5"><span>⏳</span><span>Unconfirmed</span></span>
          <span x-show="counts().unconfirmed > 0" class="badge bg-amber-100 text-amber-700" x-text="counts().unconfirmed"></span>
        </button>

        <button @click="currentView='packing'"
          :class="currentView==='packing' ? 'bg-blue-50 text-blue-800' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'"
          class="sidebar-link">
          <span class="flex items-center gap-2.5"><span>📦</span><span>Packing</span></span>
          <span x-show="counts().packing > 0" class="badge bg-blue-100 text-blue-700" x-text="counts().packing"></span>
        </button>

        <button @click="currentView='delivery'"
          :class="currentView==='delivery' ? 'bg-indigo-50 text-indigo-800' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'"
          class="sidebar-link">
          <span class="flex items-center gap-2.5"><span>🚚</span><span>Delivery</span></span>
          <span x-show="counts().delivery > 0" class="badge bg-indigo-100 text-indigo-700" x-text="counts().delivery"></span>
        </button>

        <button @click="currentView='completed'"
          :class="currentView==='completed' ? 'bg-emerald-50 text-emerald-800' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'"
          class="sidebar-link">
          <span class="flex items-center gap-2.5"><span>✅</span><span>Completed</span></span>
          <span x-show="counts().completed > 0" class="badge bg-gray-100 text-gray-600" x-text="counts().completed"></span>
        </button>

        <div class="pt-3 pb-1 px-3 text-[9px] font-bold text-gray-300 tracking-widest uppercase">Records</div>

        <button @click="currentView='customers'"
          :class="currentView==='customers' ? 'bg-gray-100 text-gray-900' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'"
          class="sidebar-link">
          <span class="flex items-center gap-2.5"><span>👥</span><span>Customers</span></span>
        </button>
      </nav>
    </div>

    <div class="p-4 border-t border-gray-50">
      <div class="flex items-center gap-2 text-xs text-gray-400 font-medium">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot"></span>
        Live · <span x-text="todayStr()"></span>
      </div>
    </div>
  </aside>

  <div class="md:hidden bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 bg-emerald-600 rounded-xl flex items-center justify-center text-white text-sm">🐾</div>
      <span class="text-sm font-black text-gray-900">PetHub OMS</span>
    </div>
    <div class="text-xs font-bold text-gray-400" x-text="viewLabel()"></div>
  </div>

  <div class="flex-1 md:ml-56 flex flex-col min-h-screen">

    <div class="hidden md:flex bg-white border-b border-gray-100 px-8 py-4 items-center justify-between sticky top-0 z-10">
      <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wider" x-text="viewLabel()"></h2>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-3 text-xs font-semibold text-gray-400">
          <span>Today's Revenue: <span class="text-emerald-600 font-black" x-text="'₹' + metrics().revenue"></span></span>
          <span class="text-gray-200">|</span>
          <span>Delivery Cost: <span class="text-red-500 font-black" x-text="'₹' + metrics().deliveryCost"></span></span>
          <span class="text-gray-200">|</span>
          <span>Net: <span class="font-black" :class="metrics().net >= 0 ? 'text-emerald-600' : 'text-red-500'" x-text="'₹' + metrics().net"></span></span>
        </div>
      </div>
    </div>

    <main class="flex-1 p-4 md:p-8 mobile-safe overflow-y-auto">

      <template x-if="currentView === 'dashboard'">
        <div class="space-y-6 max-w-4xl">

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div @click="currentView='unconfirmed'" class="bg-white border border-gray-100 rounded-2xl p-4 cursor-pointer hover:border-amber-300 transition-all group">
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Unconfirmed</div>
              <div class="text-3xl font-black text-amber-500 mt-1.5" x-text="counts().unconfirmed"></div>
              <div class="text-[10px] text-gray-300 group-hover:text-amber-400 mt-1 font-semibold transition-colors">Review →</div>
            </div>
            <div @click="currentView='packing'" class="bg-white border border-gray-100 rounded-2xl p-4 cursor-pointer hover:border-blue-300 transition-all group">
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">In Packing</div>
              <div class="text-3xl font-black text-blue-500 mt-1.5" x-text="counts().packing"></div>
              <div class="text-[10px] text-gray-300 group-hover:text-blue-400 mt-1 font-semibold transition-colors">Pack →</div>
            </div>
            <div @click="currentView='delivery'" class="bg-white border border-gray-100 rounded-2xl p-4 cursor-pointer hover:border-indigo-300 transition-all group">
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Out for Delivery</div>
              <div class="text-3xl font-black text-indigo-500 mt-1.5" x-text="counts().delivery"></div>
              <div class="text-[10px] text-gray-300 group-hover:text-indigo-400 mt-1 font-semibold transition-colors">Track →</div>
            </div>
            <div @click="currentView='completed'" class="bg-white border border-gray-100 rounded-2xl p-4 cursor-pointer hover:border-emerald-300 transition-all group">
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Delivered</div>
              <div class="text-3xl font-black text-emerald-500 mt-1.5" x-text="counts().completed"></div>
              <div class="text-[10px] text-gray-300 group-hover:text-emerald-400 mt-1 font-semibold transition-colors">Logs →</div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="bg-emerald-950 rounded-2xl p-4 text-white">
              <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Revenue Collected</div>
              <div class="text-2xl font-black mt-1" x-text="'₹' + metrics().revenue"></div>
            </div>
            <div class="bg-white border border-gray-100 rounded-2xl p-4">
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Delivery Expense</div>
              <div class="text-2xl font-black text-red-500 mt-1" x-text="'₹' + metrics().deliveryCost"></div>
            </div>
            <div class="bg-white border border-gray-100 rounded-2xl p-4">
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Net Profit</div>
              <div class="text-2xl font-black mt-1" :class="metrics().net >= 0 ? 'text-emerald-600' : 'text-red-500'" x-text="'₹' + metrics().net"></div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

            <div class="md:col-span-2 bg-white border border-gray-100 rounded-2xl p-5 space-y-3">
              <div class="flex items-center gap-2">
                <span class="text-base">⚡</span>
                <div>
                  <div class="text-sm font-bold text-gray-900">Paste WhatsApp Order</div>
                  <div class="text-[11px] text-gray-400">Paste incoming structure message string</div>
                </div>
              </div>
              <textarea x-model="rawText" rows="7"
                placeholder="*NEW ORDER: PETHUB* 🐾&#10;---&#10;🧑 *Parent:* Name&#10;📞 *Phone:* Mobile&#10;🐾 *Pet Name:* Pet&#10;📍 *Address:* Full address&#10;📮 *Pincode:* 000000&#10;&#10;*Items Ordered:*&#10;• Product Name x1 = ₹000&#10;&#10;*TOTAL: ₹000*"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-xs mono text-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all resize-none leading-relaxed"></textarea>
              <div class="flex justify-end items-center">
                <button @click="parseOrder()" class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition-all">Parse & Add Order →</button>
              </div>
            </div>

            <div class="bg-white border border-gray-100 rounded-2xl p-5 space-y-3">
              <div>
                <div class="text-sm font-bold text-gray-900">Today's Shopping List</div>
                <div class="text-[11px] text-gray-400">Items to buy — all confirmed orders</div>
              </div>
              <div class="space-y-1.5 max-h-48 overflow-y-auto">
                <template x-for="item in shoppingList()">
                  <div class="flex justify-between items-center text-xs py-1.5 border-b border-gray-50">
                    <span class="text-gray-700 font-medium truncate max-w-[160px]" x-text="item.name"></span>
                    <span class="bg-gray-900 text-white text-[10px] font-bold px-2 py-0.5 rounded-lg ml-2 shrink-0" x-text="item.qty + 'x'"></span>
                  </div>
                </template>
                <template x-if="shoppingList().length === 0">
                  <p class="text-center text-xs text-gray-300 py-6">No confirmed orders yet</p>
                </template>
              </div>
              <button @click="copyShoppingList()" class="w-full bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 text-xs font-bold py-2 rounded-xl transition-all">📋 Copy Shopping List</button>
            </div>
          </div>

          <div x-show="orders.length > 0" class="bg-white border border-gray-100 rounded-2xl p-5 space-y-3">
            <div class="flex items-center justify-between">
              <div class="text-sm font-bold text-gray-900">Today's Orders</div>
              <div class="text-[11px] text-gray-400" x-text="orders.filter(o=>o.status!=='Cancelled').length + ' total'"></div>
            </div>
            <div class="space-y-2">
              <template x-for="order in orders.filter(o=>o.status!=='Cancelled').slice().reverse()" :key="order.id">
                <div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
                  <div class="flex items-center gap-3">
                    <span class="mono text-[10px] text-gray-400 font-medium" x-text="order.id"></span>
                    <span class="text-xs font-semibold text-gray-800" x-text="order.parentName"></span>
                    <span class="text-[10px] text-gray-400" x-text="'🐾 ' + order.petName"></span>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="text-xs font-black text-gray-900" x-text="'₹' + order.total"></span>
                    <span class="stage-pill"
                      :class="{
                        'bg-amber-100 text-amber-700': order.status==='Not Confirmed',
                        'bg-blue-100 text-blue-700': order.status==='Pending Packing',
                        'bg-indigo-100 text-indigo-700': order.status==='Out for Delivery',
                        'bg-emerald-100 text-emerald-700': order.status==='Delivered',
                        'bg-red-100 text-red-500': order.status==='Cancelled'
                      }" x-text="order.status"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>

        </div>
      </template>

      <template x-if="currentView === 'unconfirmed'">
        <div class="space-y-4 max-w-5xl">

          <div class="flex items-center justify-between">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide" x-text="counts().unconfirmed + ' orders awaiting review'"></div>
            <button x-show="counts().unconfirmed > 0" @click="confirmAll()"
              class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all">
              ✓ Accept All (No Messages)
            </button>
          </div>

          <div x-show="counts().unconfirmed > 0" class="bg-amber-50 border border-amber-100 rounded-2xl px-5 py-3 flex items-center justify-between">
            <div class="text-xs text-amber-700 font-semibold">
              <span x-text="counts().unconfirmed"></span> orders · Total value:
              <span class="font-black" x-text="'₹' + orders.filter(o=>o.status==='Not Confirmed').reduce((s,o)=>s+o.total,0)"></span>
            </div>
            <div class="text-[11px] text-amber-500">Trigger explicit confirmations below</div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-for="order in orders.filter(o=>o.status==='Not Confirmed')" :key="order.id">
              <div class="order-card bg-white border border-gray-200 rounded-2xl p-5 flex flex-col gap-4">

                <div class="flex justify-between items-start">
                  <div>
                    <span class="mono text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-lg" x-text="order.id"></span>
                    <div class="text-[11px] text-gray-400 mt-1.5" x-text="'Added ' + order.timestamp"></div>
                  </div>
                  <div class="text-right">
                    <div class="text-lg font-black text-gray-900" x-text="'₹' + order.total"></div>
                    <div class="text-[10px] text-gray-400" x-text="order.items.length + ' item(s)'"></div>
                  </div>
                </div>

                <div class="bg-gray-50 rounded-xl p-3.5 space-y-1.5 text-xs">
                  <div><span class="font-bold text-gray-500">Parent</span> <span class="text-gray-800 font-semibold ml-1" x-text="order.parentName"></span></div>
                  <div><span class="font-bold text-gray-500">Phone</span> <span class="text-gray-800 font-mono font-medium ml-1" x-text="order.phone"></span></div>
                  <div><span class="font-bold text-gray-500">Pet</span> <span class="text-gray-800 font-semibold ml-1" x-text="order.petName"></span></div>
                  <div><span class="font-bold text-gray-500">Address</span> <span class="text-gray-600 ml-1" x-text="order.address"></span></div>
                  <div><span class="font-bold text-gray-500">Pincode</span> <span class="text-gray-600 ml-1" x-text="order.pincode"></span></div>
                </div>

                <div class="space-y-1">
                  <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Items</div>
                  <template x-for="item in order.items">
                    <div class="flex justify-between text-xs">
                      <span class="text-gray-700" x-text="item.name"></span>
                      <span class="font-bold text-gray-900" x-text="'x' + item.qty"></span>
                    </div>
                  </template>
                </div>

                <div class="flex gap-2 pt-1">
                  <button @click="acceptOrder(order)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl transition-all">💬 Accept & WhatsApp</button>
                  <button @click="rejectOrder(order)" class="bg-red-50 hover:bg-red-100 text-red-500 text-xs font-bold py-2.5 px-3 rounded-xl transition-all">✕</button>
                </div>
              </div>
            </template>
          </div>

          <template x-if="counts().unconfirmed === 0">
            <div class="text-center py-20 bg-white rounded-2xl border border-gray-100">
              <div class="text-4xl">🎉</div>
              <div class="text-sm text-gray-400 font-medium mt-2">All orders pipeline is clean</div>
            </div>
          </template>
        </div>
      </template>

      <template x-if="currentView === 'packing'">
        <div class="space-y-4 max-w-5xl">

          <div class="flex items-center justify-between">

<script>
function oms() {
  return {
    currentView: 'dashboard',
    rawText: '',
    toasts: [],
    msgModal: { open: false, title: '', text: '', phone: '', onCopy: null, onSkip: null },
    settlementModal: { open: false, order: null, paymentMode: 'UPI' },
    trips: [],
    orders: [],
    customers: [],

    init() {
      console.log('PetHub OMS Initialized cleanly.');
    },

    todayStr() {
      return new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    },

    viewLabel() {
      const labels = {
        dashboard: '🏠 Dashboard',
        unconfirmed: '⏳ Unconfirmed Orders',
        packing: '📦 Packing Room',
        delivery: '🚚 Delivery',
        completed: '✅ Completed',
        customers: '👥 Customers'
      };
      return labels[this.currentView] || 'PetHub';
    },

    counts() {
      return {
        unconfirmed: this.orders.filter(o => o.status === 'Not Confirmed').length,
        packing:     this.orders.filter(o => o.status === 'Pending Packing').length,
        delivery:    this.orders.filter(o => o.status === 'Out for Delivery').length,
        completed:   this.orders.filter(o => o.status === 'Delivered').length,
      };
    },

    metrics() {
      const revenue = this.orders
        .filter(o => o.status === 'Delivered')
        .reduce((s, o) => s + o.total, 0);

      const deliveryCost = this.trips.reduce((sum, t) => {
        const start = parseFloat(t.startKm) || 0;
        const end   = parseFloat(t.endKm)   || 0;
        const km    = end > start ? end - start : 0;
        return sum + km * 5;
      }, 0);

      return { revenue, deliveryCost, net: revenue - deliveryCost };
    },

    shoppingList() {
      const map = {};
      this.orders
        .filter(o => o.status === 'Pending Packing')
        .forEach(order => {
          order.items.forEach(item => {
            map[item.name] = (map[item.name] || 0) + item.qty;
          });
        });
      return Object.entries(map).map(([name, qty]) => ({ name, qty }));
    },

    toast(msg, icon = '✓') {
      const id = Date.now();
      this.toasts.push({ id, msg, icon });
      setTimeout(() => {
        this.toasts = this.toasts.filter(t => t.id !== id);
      }, 3000);
    },

    // ── Direct WhatsApp Open Routing Strategy ────────────────
    showMsg(title, text, phone, onCopy, onSkip) {
      this.msgModal = { open: true, title, text, phone, onCopy, onSkip };
    },

    openWhatsAppAndProceed() {
      let phoneStr = this.msgModal.phone.replace(/[^0-9]/g, '');
      if (phoneStr.length === 10) {
        phoneStr = '91' + phoneStr; // Default to India prefix country routing rules
      }
      
      const encodedText = encodeURIComponent(this.msgModal.text);
      const targetUrl = `https://wa.me/${phoneStr}?text=${encodedText}`;
      
      // Fire explicit browser redirect anchor
      window.open(targetUrl, '_blank');

      this.toast('Opening WhatsApp...', '🚀');
      this.msgModal.open = false;
      if (this.msgModal.onCopy) this.msgModal.onCopy();
    },

    // ── Order Parsing Engine ──────────────────────────────────
    parseOrder() {
      const text = this.rawText.trim();
      if (!text) { this.toast('Paste an order message first', '⚠️'); return; }

      const get = (regex) => { const m = text.match(regex); return m ? m[1].trim() : null; };

      const parentName = get(/\*?Parent:\*?\s*([^\n\r]+)/i)   || 'Unknown Parent';
      const phone      = get(/\*?Phone:\*?\s*([^\n\r]+)/i)    || 'N/A';
      const petName    = get(/\*?Pet Name:\*?\s*([^\n\r]+)/i) || 'Unknown Pet';
      const address    = get(/\*?Address:\*?\s*([^\n\r]+)/i)  || 'No Address';
      const pincode    = get(/\*?Pincode:\*?\s*([^\n\r]+)/i)  || 'N/A';

      const totalMatch = text.match(/TOTAL[:\s*]*[₹\s]*(\d+)/i);
      const total = totalMatch ? parseInt(totalMatch[1], 10) : 0;

      const items = [];
      text.split('\n').forEach(line => {
        const clean = line.replace(/^[•\-\*]\s*/, '').trim();
        if (!clean || clean.length < 3) return;
        if (!/x\s*\d+/i.test(clean) && !/=\s*₹/.test(clean)) return;
        const qtyM = clean.match(/x\s*(\d+)/i);
        const qty  = qtyM ? parseInt(qtyM[1]) : 1;
        const name = clean.split(/x\s*\d+/i)[0].trim().replace(/\s*=.*/, '').trim()
                       || 'Pet Product';
        if (name) items.push({ name, qty, checked: false });
      });

      if (items.length === 0) {
        items.push({ name: 'General Pet Product', qty: 1, checked: false });
      }

      const id = `PH-${1001 + this.orders.length}`;
      const order = {
        id, parentName, phone, petName, address, pincode, items, total,
        status: 'Not Confirmed',
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        paymentMode: null
      };

      this.orders.unshift(order);
      this.rawText = '';
      this.updateCustomer(parentName, petName, total);
      this.toast(`Order ${id} added`, '🐾');
      this.currentView = 'unconfirmed';
    },

    updateCustomer(parentName, petName, total) {
      const existing = this.customers.find(
        c => c.parentName.toLowerCase() === parentName.toLowerCase()
      );
      if (existing) {
        existing.ordersCount += 1;
        existing.totalSpend  += total;
      } else {
        this.customers.push({ parentName, petName, ordersCount: 1, totalSpend: total });
      }
    },

    // ── Pipeline State Machinery ─────────────────────────────
    acceptOrder(order) {
      order.status = 'Pending Packing';
      const msg = this.buildConfirmMsg(order);
      this.showMsg(
        'Order Confirmed! 🚀',
        msg,
        order.phone,
        () => { this.toast(`${order.id} moved to Packing Room`, '📦'); },
        () => { this.toast(`${order.id} moved to Packing Room`, '📦'); }
      );
    },

    rejectOrder(order) {
      order.status = 'Cancelled';
      this.toast(`${order.id} flagged as cancelled`, '✕');
    },

    confirmAll() {
      const pending = this.orders.filter(o => o.status === 'Not Confirmed');
      pending.forEach(o => { o.status = 'Pending Packing'; });
      this.toast(`${pending.length} orders updated directly`, '✓');
      this.currentView = 'packing';
    },

    shipOrder(order) {
      order.status = 'Out for Delivery';
      const msg = this.buildDeliveryMsg(order);
      this.showMsg(
        'Out for Delivery! 🛵',
        msg,
        order.phone,
        () => { this.toast(`${order.id} assigned to transit loop`, '🚚'); },
        () => { this.toast(`${order.id} assigned to transit loop`, '🚚'); }
      );
    },

    openSettlement(order) {
      this.settlementModal = { open: true, order, paymentMode: 'UPI' };
    },

    confirmDelivered() {
      const order = this.settlementModal.order;
      if (!order) return;
      order.status = 'Delivered';
      order.paymentMode = this.settlementModal.paymentMode;
      this.settlementModal.open = false;
      this.toast(`${order.id} marked delivered via ${order.paymentMode}`, '✅');
    },

    addTrip() {
      this.trips.push({ id: Date.now(), startKm: '', endKm: '' });
    },

    // ── WhatsApp Standard Text Payload Builders ──────────────
    buildConfirmMsg(order) {
      const itemLines = order.items.map(i => `  • ${i.name} ×${i.qty}`).join('\n');
      return `Hi ${order.parentName}! 👋\n\nYour PetHub order has been confirmed ✅\n\n🆔 Order ID: ${order.id}\n🐾 For: ${order.petName}\n\n📦 Items:\n${itemLines}\n\n💰 Total: ₹${order.total}\n🚚 Delivery: FREE\n\nWe're packing your order now and will send another update once it's on the way! 🐾\n\n— PetHub 🛒`;
    },

    buildDeliveryMsg(order) {
      const itemLines = order.items.map(i => `  • ${i.name} ×${i.qty}`).join('\n');
      return `Hi ${order.parentName}! 🛵\n\nYour PetHub order is now OUT FOR DELIVERY! 🚀\n\n🆔 Order ID: ${order.id}\n🐾 For: ${order.petName}\n\n📦 Items:\n${itemLines}\n\n📍 Delivering to: ${order.address}\n📮 Pincode: ${order.pincode}\n💰 Amount to pay: ₹${order.total}\n\nOur rider is on the way — please keep your phone handy! 🐾\n\n— PetHub 🛒`;
    },

    copyShoppingList() {
      const list = this.shoppingList();
      if (list.length === 0) { this.toast('Nothing to copy yet', '⚠️'); return; }
      const text = '🛒 PetHub Shopping List\n\n' +
        list.map(i => `• ${i.name}  ×${i.qty}`).join('\n');
      navigator.clipboard.writeText(text).catch(() => {});
      this.toast('Shopping list copied!', '📋');
    }
  };
}
</script>
</body>
</html>
